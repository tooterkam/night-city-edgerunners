
name: Build Night City IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build iOS app
        run: |
          xcodebuild \
            -project NightCityEdgerunners.xcodeproj \
            -scheme NightCityEdgerunners \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.example.NightCityEdgerunners \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NightCityEdgerunners.app Payload/
          zip -r NightCityEdgerunners-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NightCity-IPA
          path: NightCityEdgerunners-unsigned.ipa
